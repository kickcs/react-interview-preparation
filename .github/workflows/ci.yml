name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (app)
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Typecheck (ws-server)
        run: bunx tsc --noEmit -p tsconfig.server.json

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
